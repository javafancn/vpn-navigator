name: PF preview syntax checks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Sources/VPNNavigatorCore/FirewallRulePreview.swift'
      - 'Sources/VPNNavigatorCore/LeakGuardPolicy.swift'
      - 'Sources/VPNNavigatorPFPreview/**'
      - '.github/workflows/pf-preview.yml'
      - 'Package.swift'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-only:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and emit candidate rules
        run: |
          swift run VPNNavigatorPFPreview > "$RUNNER_TEMP/pf-vpn-navigator-preview.conf"
          swift run VPNNavigatorPFPreview --strict > "$RUNNER_TEMP/pf-vpn-navigator-strict.conf"
          test -s "$RUNNER_TEMP/pf-vpn-navigator-preview.conf"
          grep -q 'if-bound' "$RUNNER_TEMP/pf-vpn-navigator-strict.conf"
          grep -q 'block drop out quick on en0 inet6' "$RUNNER_TEMP/pf-vpn-navigator-preview.conf"
      - name: PF syntax check (never load/enable firewall)
        run: |
          sudo /sbin/pfctl -vnf "$RUNNER_TEMP/pf-vpn-navigator-preview.conf"
          sudo /sbin/pfctl -vnf "$RUNNER_TEMP/pf-vpn-navigator-strict.conf"
          echo 'Candidate anchor syntax parsed; no PF changes made.'

