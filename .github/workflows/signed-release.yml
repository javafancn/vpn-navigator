name: Signed macOS release (manual)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RELEASE to build signed installers'
        required: true
        type: string
      engine_version:
        description: 'Reviewed exact OpenVPN 2.7.x version'
        required: true
        type: string
      source_sha256:
        description: 'Reviewed OpenVPN source SHA256'
        required: true
        type: string
      openssl_sha256:
        description: 'Reviewed OpenSSL source SHA256'
        required: true
        type: string
      create_draft_release:
        description: 'Attach verified installers to a draft release (never publish automatically)'
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RELEASE'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    environment: macos-release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify inputs and sources before loading any signing credentials
        env:
          EXPECTED_ENGINE: ${{ inputs.engine_version }}
          EXPECTED_VPN_SHA: ${{ inputs.source_sha256 }}
          EXPECTED_SSL_SHA: ${{ inputs.openssl_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ENGINE" =~ ^2\.7\.[0-9]+$ ]]
          [[ "$EXPECTED_VPN_SHA" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "$EXPECTED_SSL_SHA" =~ ^[0-9a-fA-F]{64}$ ]]
          swift test
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/fetch-engine-sources.py "$RUNNER_TEMP/engine-sources"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = json.loads((Path(os.environ['RUNNER_TEMP']) / 'engine-sources/sources.json').read_text())
          assert source['OPENVPN_SOURCE_VERSION'] == os.environ['EXPECTED_ENGINE']
          assert source['OPENVPN_SOURCE_SHA256'].lower() == os.environ['EXPECTED_VPN_SHA'].lower()
          assert source['OPENSSL_SOURCE_SHA256'].lower() == os.environ['EXPECTED_SSL_SHA'].lower()
          PY
      - name: Build portable engine from pinned sources
        run: |
          ENGINE_OUTPUT_DIR="$RUNNER_TEMP/engine-prefix" bash scripts/build-openvpn-engine.sh

      - name: Set up temporary signing keychain
        env:
          APP_P12: ${{ secrets.APP_SIGNING_P12_BASE64 }}
          APP_PASSWORD: ${{ secrets.APP_SIGNING_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.INSTALLER_SIGNING_P12_BASE64 }}
          INSTALLER_PASSWORD: ${{ secrets.INSTALLER_SIGNING_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.TEMP_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APP_P12:?missing APP_SIGNING_P12_BASE64}"
          : "${INSTALLER_P12:?missing INSTALLER_SIGNING_P12_BASE64}"
          : "${KEYCHAIN_PASSWORD:?missing TEMP_KEYCHAIN_PASSWORD}"
          KEYCHAIN="$RUNNER_TEMP/vpn-navigator-release.keychain-db"
          echo "VN_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          printf '%s' "$APP_P12" | base64 -D > "$RUNNER_TEMP/app.p12"
          printf '%s' "$INSTALLER_P12" | base64 -D > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" -P "$APP_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$INSTALLER_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

      - name: Configure notarization credentials
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${NOTARY_KEY_BASE64:?missing NOTARY_API_KEY_BASE64}"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials "vpn-navigator-release" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Sign and notarize app and architecture-specific installer
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
        run: |
          set -euo pipefail
          export OPENVPN_BIN="$RUNNER_TEMP/engine-prefix/sbin/openvpn"
          export THIRD_PARTY_NOTICES="$RUNNER_TEMP/engine-prefix/share/vpn-navigator/THIRD_PARTY_NOTICES.txt"
          zsh scripts/build-app.sh
          NOTARY_KEYCHAIN_PROFILE=vpn-navigator-release zsh scripts/notarize.sh app
          zsh scripts/build-pkg.sh
          NOTARY_KEYCHAIN_PROFILE=vpn-navigator-release zsh scripts/notarize.sh pkg
          zsh scripts/release-audit.sh
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          PKG="dist/VPN-Navigator-$VERSION-$(uname -m).pkg"
          spctl --assess --type execute --verbose=2 'dist/VPN Navigator.app'
          spctl --assess --type install --verbose=2 "$PKG"
          (cd dist && shasum -a 256 "$(basename "$PKG")" > "$(basename "$PKG").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: VPNNavigator-signed-${{ matrix.architecture }}
          path: |
            dist/VPN-Navigator-*.pkg
            dist/VPN-Navigator-*.sha256
            dist/VPN-Navigator-*-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Delete temporary signing keychain
        if: always()
        run: |
          if [[ -n "${VN_SIGN_KEYCHAIN:-}" ]]; then security delete-keychain "$VN_SIGN_KEYCHAIN"; fi

  draft-release:
    needs: signed-release
    if: inputs.create_draft_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: VPNNavigator-signed-*
          path: installers
          merge-multiple: true
      - name: Create or update a draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, pathlib, plistlib, subprocess, os
          version = plistlib.loads(pathlib.Path('Resources/Info.plist').read_bytes())['CFBundleShortVersionString']
          tag = 'v' + version
          current = subprocess.run(['gh', 'release', 'view', tag, '--json', 'isDraft'], capture_output=True, text=True)
          if current.returncode == 0:
              assert json.loads(current.stdout)['isDraft'], 'Refusing to replace a published release'
          else:
              subprocess.run(['gh', 'release', 'create', tag, '--draft', '--target', os.environ['GITHUB_SHA'],
                              '--title', 'VPN Navigator ' + version,
                              '--notes', 'Signed and notarized architecture-specific review builds. Complete hardware VPN, DNS, IPv6 and leak acceptance before publication.'], check=True)
          assets = [str(p) for p in pathlib.Path('installers').iterdir() if p.is_file()]
          subprocess.run(['gh', 'release', 'upload', tag, *assets, '--clobber'], check=True)
          PY
