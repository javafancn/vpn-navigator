name: Local test installer and XPC trust
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install-local:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified sources
        run: python3 scripts/fetch-engine-sources.py "$RUNNER_TEMP/local-engine-sources"
      - uses: actions/cache@v4
        id: engine-cache
        with:
          path: ${{ runner.temp }}/engine-prefix
          key: source-engine-${{ runner.arch }}-${{ env.OPENVPN_SOURCE_SHA256 }}-${{ env.OPENSSL_SOURCE_SHA256 }}-${{ hashFiles('scripts/build-openvpn-engine.sh') }}
      - name: Build engine and local runtime-signed application
        env:
          CACHE_HIT: ${{ steps.engine-cache.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" != true ]]; then
            ENGINE_OUTPUT_DIR="$RUNNER_TEMP/engine-prefix" bash scripts/build-openvpn-engine.sh
          fi
          export OPENVPN_BIN="$RUNNER_TEMP/engine-prefix/sbin/openvpn"
          export THIRD_PARTY_NOTICES="$RUNNER_TEMP/engine-prefix/share/vpn-navigator/THIRD_PARTY_NOTICES.txt"
          VPNNAV_CHANNEL=local-test zsh scripts/build-app.sh
          zsh scripts/build-local-pkg.sh
      - name: Install through macOS Installer (disposable runner only)
        run: |
          stat -f 'Console UID %u' /dev/console
          sudo /usr/sbin/installer -pkg dist/*-Local.pkg -target /
      - name: Test actual root service and both sides of XPC authentication
        run: python3 scripts/local-tests/test-installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: VPNNavigator-Local-${{ runner.arch }}
          path: |
            dist/*-Local.pkg
            dist/*-Local-Uninstall.pkg
            dist/*-Local-SHA256.txt
            dist/*-Local-manifest.json
          if-no-files-found: error
          retention-days: 14
