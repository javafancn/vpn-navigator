name: Swift core tests
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check bilingual catalog and production coverage
        run: python3 scripts/check-localization.py
      - name: Verify native IPv6 route encoding without system mutations
        run: python3 -m unittest discover -s scripts/tests -p test_native_routes.py -v
      - name: Verify DNS hook distinguishes cache failure from DNS application failure
        run: python3 -m unittest discover -s scripts/tests -p test_dns_hook_failure.py -v
      - name: Verify installation validation cache invalidates changed inputs
        run: python3 -m unittest discover -s scripts/tests -p test_validation_cache.py -v
      - name: Build
        run: swift build
      - name: Verify DNS cache failure cannot block connection or recovery
        run: 'python3 scripts/test-dns-cache-failure.py "$(swift build --show-bin-path)"'
      - name: Verify workspace keyboard and accessibility in the debug build
        if: ${{ !endsWith(matrix.runner, '-intel') }}
        run: |
          defaults write NSGlobalDomain AppleKeyboardUIMode -int 3
          python3 - <<'PYTEST'
          import subprocess
          from pathlib import Path
          folder = subprocess.check_output(['swift', 'build', '--show-bin-path'], text=True).strip()
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', str(Path(folder) / 'VPNNavigatorApp'), '--vpnnav-workspace-accessibility-self-test'], check=True, timeout=60)
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', str(Path(folder) / 'VPNNavigatorApp'), '--vpnnav-workspace-accessibility-self-test', '--vpnnav-language=en'], check=True, timeout=60)
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', str(Path(folder) / 'VPNNavigatorApp'), '--vpnnav-localization-self-test', '--vpnnav-language=en'], check=True, timeout=60)
          PYTEST
      - name: Verify status throughput and actual background-window lifecycle
        env:
          # Intel hosted runners can spend tens of seconds waiting for Dock
          # restore transactions. Keep the complete lifecycle test bounded.
          VPNNAV_UI_SELF_TEST_TIMEOUT: '90'
        run: |
          python3 - <<'PYTEST'
          import subprocess
          from pathlib import Path
          folder = subprocess.check_output(['swift', 'build', '--show-bin-path'], text=True).strip()
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', str(Path(folder) / 'VPNNavigatorApp'), '--vpnnav-status-bar-self-test'], check=True, timeout=110)
          PYTEST
      - name: Verify overview live graph and connection protection presentation
        run: |
          python3 - <<'PYTEST'
          import subprocess
          from pathlib import Path
          folder = subprocess.check_output(['swift', 'build', '--show-bin-path'], text=True).strip()
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', str(Path(folder) / 'VPNNavigatorApp'), '--vpnnav-overview-self-test'], check=True, timeout=60)
          PYTEST
      - name: Unit tests
        run: swift test
      - name: Verify server identity and cross-process profile transactions
        run: |
          python3 - <<'PYTEST'
          import subprocess
          folder = subprocess.check_output(['swift', 'build', '--show-bin-path'], text=True).strip()
          subprocess.run(['python3', 'scripts/test-profile-safety.py', folder], check=True, timeout=240)
          PYTEST
      - name: Verify real split DNS relay and domestic/remote latency separation
        run: 'python3 scripts/test-split-dns.py "$(swift build --show-bin-path)/VPNNavigatorHelper"'
      - name: Verify web latency intervals, failure statistics and session comparison
        run: python3 -m unittest discover -s scripts/tests -p test_web_latency_sampler.py -v
      - name: Verify DNS TTL cache, address-family policy and guarded endpoint candidates
        run: '"$(swift build --show-bin-path)/VPNNavigatorHelper" --self-test-network-latency'
      - name: Verify reviewed DNS scope, first-install dual-stack seeds and strict profile options
        run: '"$(swift build --show-bin-path)/VPNNavigatorHelper" --self-test-review-regressions Resources/Rules'
      - name: Verify idle helper channel and asynchronous smart-connection races
        run: 'python3 scripts/test-review-app-regressions.py "$(swift build --show-bin-path)"'
      - name: Verify route rollback ordering without system mutations
        run: '"$(swift build --show-bin-path)/VPNNavigatorHelper" --self-test-route-ordering'

      - name: Verify parsed rule cache and ordered connection history
        run: '"$(swift build --show-bin-path)/VPNNavigatorHelper" --self-test-core-optimizations'
      - name: Compare native network reads with system tools without mutations
        run: '"$(swift build --show-bin-path)/VPNNavigatorHelper" --self-test-native-network'
      - name: Verify real management authentication and cancellation
        run: 'python3 scripts/test-management-socket.py "$(swift build --show-bin-path)/VPNNavigatorHelper"'
      - name: Verify delayed management startup, early exits, cancellation and deadline
        run: 'sudo -n env GITHUB_ACTIONS=true "$(swift build --show-bin-path)/VPNNavigatorHelper" --self-test-management-startup'
