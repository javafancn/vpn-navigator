name: Native development package
on:
  workflow_dispatch:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify plists and scripts
        run: |
          plutil -lint Resources/Info.plist Resources/LaunchDaemons/*.plist Resources/LaunchAgents/*.plist
          zsh -n scripts/build-app.sh scripts/build-pkg.sh scripts/notarize.sh scripts/release-audit.sh scripts/pkg-scripts/preinstall scripts/live-route-assert.sh
          python3 -m py_compile scripts/vendor-openvpn.py
      - name: Build dual-architecture developer-only app
        env:
          VPNNAV_BUILD_UNIVERSAL: "1"
        run: zsh scripts/build-app.sh
      - name: Verify development bundle
        run: |
          test -x 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp'
          test -x 'dist/VPN Navigator.app/Contents/Resources/VPNNavigatorHelper'
          test -x 'dist/VPN Navigator.app/Contents/Resources/VPNNavigatorRuleAgent'
          test -x 'dist/VPN Navigator.app/Contents/Resources/macos-dns-updown.sh'
          test -f 'dist/VPN Navigator.app/Contents/Resources/LICENSES/OpenVPN-DNS-BSD-2-Clause.txt'
          /bin/bash -n 'dist/VPN Navigator.app/Contents/Resources/macos-dns-updown.sh'
          test ! -f 'dist/VPN Navigator.app/Contents/Resources/openvpn'
      - name: Verify Apple Silicon and Intel slices
        run: |
          for entry in \
            'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp' \
            'dist/VPN Navigator.app/Contents/Resources/VPNNavigatorHelper' \
            'dist/VPN Navigator.app/Contents/Resources/VPNNavigatorRuleAgent'; do
            archs="$(lipo -archs "$entry")"
            echo "$entry: $archs"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || exit 1
          done
      - name: Ad-hoc sign development UI for local integrity checks
        run: |
          APP='dist/VPN Navigator.app'
          codesign --force --sign - --identifier com.javafancn.vpn-navigator.helper "$APP/Contents/Resources/VPNNavigatorHelper"
          codesign --force --sign - --identifier com.javafancn.vpn-navigator.rule-agent "$APP/Contents/Resources/VPNNavigatorRuleAgent"
          codesign --force --sign - --identifier com.javafancn.vpn-navigator "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo 'This ad-hoc signature is NOT an Apple Developer ID signature and is NOT notarized.'
      - name: Best-effort native UI screenshot (macOS CI)
        continue-on-error: true
        run: |
          # Test against a REAL macOS desktop image, not in-app scenery.
          # CI machines often start with a monochrome desktop which makes
          # transparent native material look opaque in screenshots.
          WALLPAPER="$(find '/System/Library/Desktop Pictures' -type f \( -iname '*.heic' -o -iname '*.jpg' -o -iname '*.png' \) 2>/dev/null | head -n 1 || true)"
          if [[ -n "$WALLPAPER" ]]; then
            export VPNNAV_TEST_WALLPAPER="$WALLPAPER"
            cat > "$RUNNER_TEMP/desktop-wallpaper.swift" <<'SWIFT'
          import AppKit
          import Foundation
          if let path = ProcessInfo.processInfo.environment["VPNNAV_TEST_WALLPAPER"] {
              for screen in NSScreen.screens {
                  do {
                      try NSWorkspace.shared.setDesktopImageURL(
                          URL(fileURLWithPath: path), for: screen, options: [:])
                      print("Desktop wallpaper configured: \(path)")
                  } catch {
                      print("Desktop wallpaper update unavailable: \(error)")
                  }
              }
          }
          SWIFT
            swift "$RUNNER_TEMP/desktop-wallpaper.swift" || true
            sleep 3
          fi
          screencapture -x "$RUNNER_TEMP/VPNNavigator-Desktop-Before.png" || true
          APP='dist/VPN Navigator.app'
          # Render ALL FIVE REAL SwiftUI pages against a system wallpaper.
          # No screenshot or wallpaper becomes part of the app bundle.
          for PAGE in overview profiles routing diagnostics settings; do
            killall VPNNavigatorApp 2>/dev/null || true
            sleep 1
            open -n "$APP" --args "--vpnnav-ui-tab=$PAGE" "--vpnnav-ui-glass-snapshot" "--vpnnav-ui-demo-snapshot" || true
            sleep 5
            screencapture -x "$RUNNER_TEMP/VPNNavigator-$PAGE.png" || true
            if [[ ! -s "$RUNNER_TEMP/VPNNavigator-$PAGE.png" ]]; then
              echo "WindowServer screenshot unavailable for $PAGE"
            fi
          done
          killall VPNNavigatorApp 2>/dev/null || true
          # Compare the same native desktop under three frosted veil strengths.
          # These are reference-only screenshot arguments, not real-user data.
          for FOG in lighter denser; do
            open -n "$APP" --args "--vpnnav-ui-tab=overview" "--vpnnav-ui-glass-snapshot" "--vpnnav-ui-demo-snapshot" "--vpnnav-mist=$FOG" || true
            sleep 5
            screencapture -x "$RUNNER_TEMP/VPNNavigator-fog-$FOG.png" || true
            killall VPNNavigatorApp 2>/dev/null || true
            sleep 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: VPNNavigator-visual-smoke
          path: |
            ${{ runner.temp }}/VPNNavigator-overview.png
            ${{ runner.temp }}/VPNNavigator-profiles.png
            ${{ runner.temp }}/VPNNavigator-routing.png
            ${{ runner.temp }}/VPNNavigator-diagnostics.png
            ${{ runner.temp }}/VPNNavigator-settings.png
            ${{ runner.temp }}/VPNNavigator-Desktop-Before.png
            ${{ runner.temp }}/VPNNavigator-fog-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Package verified .app using macOS ditto
        run: |
          APP='dist/VPN Navigator.app'
          OUT="$RUNNER_TEMP/VPN-Navigator-0.1.0-macOS-Universal-UI-Test.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          unzip -t "$OUT"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$(basename "$OUT")" | tee VPN-Navigator-0.1.0-macOS-Universal-UI-Test.sha256)
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: VPNNavigator-0.1.0-macOS-Universal-UI-Test
          path: |
            ${{ runner.temp }}/VPN-Navigator-0.1.0-macOS-Universal-UI-Test.zip
            ${{ runner.temp }}/VPN-Navigator-0.1.0-macOS-Universal-UI-Test.sha256
          if-no-files-found: error
