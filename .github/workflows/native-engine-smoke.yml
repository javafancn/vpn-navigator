name: Standalone OpenVPN engine smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build-app.sh'
      - 'scripts/vendor-openvpn.py'
      - 'Resources/Engine/macos-dns-updown.sh'
      - '.github/workflows/native-engine-smoke.yml'
      - 'Sources/VPNNavigatorHelper/**'
      - 'Sources/VPNNavigatorCore/LeakGuardPolicy.swift'
      - 'scripts/test-pf-loopback.py'
      - 'scripts/build-openvpn-engine.sh'
      - 'scripts/fetch-engine-sources.py'
      - 'scripts/release-manifest.py'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vendor-engine:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenVPN CLI on build runner only
        run: brew install openvpn
      - name: Build portable unsigned development bundle
        run: |
          OPENVPN_BIN="$(brew --prefix openvpn)/sbin/openvpn" \
            zsh scripts/build-app.sh
      - name: Validate dependency relocation
        run: |
          APP='dist/VPN Navigator.app'
          "$APP/Contents/Resources/openvpn" --version
          python3 -m json.tool "$APP/Contents/Resources/openvpn-dependencies.json" >/dev/null
          test -x "$APP/Contents/Resources/macos-dns-updown.sh"
          /bin/bash -n "$APP/Contents/Resources/macos-dns-updown.sh"
      - name: Reject injected DNS variables without running them
        run: |
          hook='dist/VPN Navigator.app/Contents/Resources/macos-dns-updown.sh'
          safe="$RUNNER_TEMP/dns-safe.env"
          bad="$RUNNER_TEMP/dns-bad.env"
          sentinel="$RUNNER_TEMP/dns-injection-sentinel"
          printf 'dev=utun4\nscript_type=dns-up\ndns_server_1_address_1=10.8.0.1\n' > "$safe"
          chmod 600 "$safe"
          env dns_vars_file="$safe" /bin/bash "$hook" --check-dns-vars
          printf 'dev=utun4\nscript_type=dns-up\ndns_search_domain_1=$(touch /tmp/unsafe-dns)\n' > "$bad"
          chmod 600 "$bad"
          if env dns_vars_file="$bad" /bin/bash "$hook" --check-dns-vars; then
            echo 'Unsafe DNS variable was accepted' >&2; exit 1
          fi
          if [[ -e /tmp/unsafe-dns ]]; then
            echo 'Unsafe DNS variable was executed' >&2; exit 1
          fi
          if env dev=utun4 script_type=dns-up dns_search_domain_1='a;malicious'               /bin/bash "$hook" --check-dns-vars; then
            echo 'Unsafe inherited DNS variable was accepted' >&2; exit 1
          fi
      - name: Build reviewed-format sources for the declared minimum macOS
        run: |
          python3 scripts/fetch-engine-sources.py "$RUNNER_TEMP/engine-sources"
      - name: Compile static-OpenSSL engine and verify minimum OS
        run: |
          ENGINE_OUTPUT_DIR="$RUNNER_TEMP/engine-prefix" bash scripts/build-openvpn-engine.sh
          OPENVPN_BIN="$RUNNER_TEMP/engine-prefix/sbin/openvpn" zsh scripts/build-app.sh
          python3 scripts/release-manifest.py 'dist/VPN Navigator.app' "$RUNNER_TEMP/source-engine-manifest.json"
      - name: Test DNS ownership journal on a synthetic service
        run: |
          swift build --product VPNNavigatorHelper
          sudo "$(swift build --show-bin-path)/VPNNavigatorHelper" --self-test-dns-journal
      - name: Test actual PF blocking on one loopback port
        run: |
          python3 scripts/test-pf-loopback.py "$(swift build --show-bin-path)/VPNNavigatorHelper"
      - name: Report
        run: |
          echo 'Engine smoke test passed on macOS runner.'
          echo 'This bundle is unsigned and cannot register the privileged VPN helper.'

