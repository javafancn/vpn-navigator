name: Native development package
on:
  workflow_dispatch:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify plists and scripts
        run: |
          echo "VPNNAV_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)" >> "$GITHUB_ENV"
          plutil -lint Resources/Info.plist Resources/LaunchDaemons/*.plist Resources/LaunchAgents/*.plist
          zsh -n scripts/build-app.sh scripts/build-pkg.sh scripts/notarize.sh scripts/release-audit.sh scripts/pkg-scripts/preinstall scripts/live-route-assert.sh
          python3 -m py_compile scripts/vendor-openvpn.py
          python3 scripts/check-localization.py
      - name: Build dual-architecture developer-only app
        env:
          VPNNAV_BUILD_UNIVERSAL: "1"
        run: zsh scripts/build-app.sh
      - name: Exercise real network diagnostics on loopback
        run: |
          # Python timeout is available on the runner and does not depend on brew.
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-network-self-test'], check=True, timeout=60)
          PYTEST
      - name: Verify development bundle
        # The same release UI binary exercises panel and Carbon registration.
        run: |
          test -x 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp'
          test -x 'dist/VPN Navigator.app/Contents/Resources/VPNNavigatorHelper'
          test -x 'dist/VPN Navigator.app/Contents/Resources/VPNNavigatorRuleAgent'
          test -x 'dist/VPN Navigator.app/Contents/Resources/macos-dns-updown.sh'
          test -f 'dist/VPN Navigator.app/Contents/Resources/LICENSES/OpenVPN-DNS-BSD-2-Clause.txt'
          /bin/bash -n 'dist/VPN Navigator.app/Contents/Resources/macos-dns-updown.sh'
          test ! -f 'dist/VPN Navigator.app/Contents/Resources/openvpn'
          if strings 'dist/VPN Navigator.app/Contents/Resources/VPNNavigatorHelper' | grep -F -- '--self-test-management'; then
            echo 'Debug management fixture leaked into release helper'; exit 1
          fi
      - name: Verify Apple Silicon and Intel slices
        run: |
          for entry in \
            'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp' \
            'dist/VPN Navigator.app/Contents/Resources/VPNNavigatorHelper' \
            'dist/VPN Navigator.app/Contents/Resources/VPNNavigatorRuleAgent'; do
            archs="$(lipo -archs "$entry")"
            echo "$entry: $archs"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || exit 1
          done
      - name: Verify branded bundle and background-window lifecycle
        run: |
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-status-bar-self-test'], check=True, timeout=60)
          PYTEST
      - name: Verify native quick panel and actual global shortcut registration
        run: |
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-quick-access-self-test'], check=True, timeout=60)
          PYTEST
      - name: Verify profile import, native file requests and drop providers
        run: |
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-profile-transfer-self-test'], check=True, timeout=60)
          PYTEST
      - name: Verify live routing mode model and persistence failures
        # Routing tests call the same AppModel with an injected helper. They
        # never launch a VPN or mutate the runner's network.
        run: |
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-routing-mode-self-test'], check=True, timeout=60)
          PYTEST
      - name: Verify profile index recovery and stale confirmation
        run: |
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-profile-recovery-self-test'], check=True, timeout=60)
          PYTEST
      - name: Verify profile library filters and pinned metadata actions
        run: |
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-profile-library-self-test'], check=True, timeout=60)
          PYTEST
      - name: Verify custom routing tools and one-click loopback diagnostics
        run: |
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-routing-tools-self-test'], check=True, timeout=60)
          PYTEST
      - name: Verify smart connection cancellation and opt-in status notifications
        run: |
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-smart-connection-self-test'], check=True, timeout=60)
          PYTEST
      - name: Verify encrypted backup restore, cancellation and active-session exclusion
        run: |
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-profile-backup-self-test'], check=True, timeout=60)
          PYTEST
      - name: Verify offline profile health and confirmed configuration updates
        run: |
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-profile-health-self-test'], check=True, timeout=60)
          PYTEST
      - name: Verify ordered connection history and live-rate model
        run: |
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-connection-history-self-test'], check=True, timeout=60)
          PYTEST
      - name: Verify bounded public-egress client against loopback HTTP only
        run: |
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-public-egress-self-test'], check=True, timeout=60)
          PYTEST
      - name: Verify actual workspace shortcuts, keyboard focus and accessibility tree
        run: |
          defaults write NSGlobalDomain AppleKeyboardUIMode -int 3
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-workspace-accessibility-self-test'], check=True, timeout=60)
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-workspace-accessibility-self-test', '--vpnnav-language=en'], check=True, timeout=60)
          subprocess.run(['python3', 'scripts/run-ui-self-test.py', 'dist/VPN Navigator.app/Contents/MacOS/VPNNavigatorApp', '--vpnnav-localization-self-test', '--vpnnav-language=en'], check=True, timeout=60)
          PYTEST
      - name: Ad-hoc sign development UI for local integrity checks
        run: |
          APP='dist/VPN Navigator.app'
          codesign --force --sign - --identifier com.javafancn.vpn-navigator.helper "$APP/Contents/Resources/VPNNavigatorHelper"
          codesign --force --sign - --identifier com.javafancn.vpn-navigator.rule-agent "$APP/Contents/Resources/VPNNavigatorRuleAgent"
          codesign --force --sign - --identifier com.javafancn.vpn-navigator "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo 'This ad-hoc signature is NOT an Apple Developer ID signature and is NOT notarized.'
      - name: Capture all five native workspaces
        run: |
          trap 'screencapture -x "$RUNNER_TEMP/VPNNavigator-capture-failure.png" || true' ERR
          # Ephemeral CI machine only: native AppKit materials also respect
          # accessibility defaults, independently of the SwiftUI snapshot flag.
          defaults write com.apple.universalaccess reduceTransparency -bool false || true
          # Test against a REAL macOS desktop image, not in-app scenery.
          # CI machines often start with a monochrome desktop which makes
          # transparent native material look opaque in screenshots.
          WALLPAPER="$(find '/System/Library/Desktop Pictures' -type f \( -iname '*.heic' -o -iname '*.jpg' -o -iname '*.png' \) 2>/dev/null | head -n 1 || true)"
          if [[ -n "$WALLPAPER" ]]; then
            export VPNNAV_TEST_WALLPAPER="$WALLPAPER"
            cat > "$RUNNER_TEMP/desktop-wallpaper.swift" <<'SWIFT'
          import AppKit
          import Foundation
          if let path = ProcessInfo.processInfo.environment["VPNNAV_TEST_WALLPAPER"] {
              for screen in NSScreen.screens {
                  do {
                      try NSWorkspace.shared.setDesktopImageURL(
                          URL(fileURLWithPath: path), for: screen, options: [:])
                      print("Desktop wallpaper configured: \(path)")
                  } catch {
                      print("Desktop wallpaper update unavailable: \(error)")
                  }
              }
          }
          SWIFT
            swift "$RUNNER_TEMP/desktop-wallpaper.swift" || true
            sleep 3
          fi
          screencapture -x "$RUNNER_TEMP/VPNNavigator-Desktop-Before.png" || true
          cat > "$RUNNER_TEMP/window-id.swift" <<'SWIFT'
          import AppKit
          import CoreGraphics
          let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          for item in windows {
              let owner = item[kCGWindowOwnerName as String] as? String ?? ""
              let bounds = item[kCGWindowBounds as String] as? [String: Any] ?? [:]
              if owner.contains("VPN"), let width = bounds["Width"] as? Double, width >= 800,
                 let number = item[kCGWindowNumber as String] as? Int {
                  print(number)
                  FileHandle.standardError.write(Data("owner=\(owner), bounds=\(bounds)\n".utf8))
                  exit(0)
              }
          }
          exit(1)
          SWIFT
          APP="$PWD/dist/VPN Navigator.app"
          for PAGE in overview profiles routing diagnostics settings; do
            killall VPNNavigatorApp 2>/dev/null || true
            sleep 1
            open -n "$APP" --args "--vpnnav-ui-tab=$PAGE" "--vpnnav-ui-glass-snapshot" "--vpnnav-ui-demo-snapshot"
            sleep 7
            WINDOW_ID="$(swift "$RUNNER_TEMP/window-id.swift" 2> "$RUNNER_TEMP/$PAGE-bounds.txt")"
            cat "$RUNNER_TEMP/$PAGE-bounds.txt"
            screencapture -x -o -l "$WINDOW_ID" "$RUNNER_TEMP/VPNNavigator-$PAGE.png"
            screencapture -x "$RUNNER_TEMP/VPNNavigator-display-$PAGE.png"
            test -s "$RUNNER_TEMP/VPNNavigator-$PAGE.png"
          done
          killall VPNNavigatorApp 2>/dev/null || true
          # The exact same binary/UI, with two external desktop colours.
          open -n "$APP" --args --vpnnav-ui-glass-snapshot --vpnnav-ui-demo-snapshot --vpnnav-ui-quick-access-snapshot
          sleep 7
          cat > "$RUNNER_TEMP/quick-window-id.swift" <<'SWIFT'
          import AppKit
          import CoreGraphics
          let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          let expectedWidth = Double(CommandLine.arguments.dropFirst().first ?? "560") ?? 560
          for window in windows {
              let owner = window[kCGWindowOwnerName as String] as? String ?? ""
              let bounds = window[kCGWindowBounds as String] as? [String: Any] ?? [:]
              if owner.contains("VPN"), let width = bounds["Width"] as? Double,
                 abs(width - expectedWidth) <= 10, let number = window[kCGWindowNumber as String] as? Int {
                  print(number); exit(0)
              }
          }
          exit(1)
          SWIFT
          WINDOW_ID="$(swift "$RUNNER_TEMP/quick-window-id.swift")"
          screencapture -x -o -l "$WINDOW_ID" "$RUNNER_TEMP/VPNNavigator-quick-access.png"
          test -s "$RUNNER_TEMP/VPNNavigator-quick-access.png"
          killall VPNNavigatorApp 2>/dev/null || true
          open -n "$APP" --args --vpnnav-ui-tab=profiles --vpnnav-ui-glass-snapshot --vpnnav-ui-demo-snapshot --vpnnav-ui-import-report-snapshot
          sleep 7
          WINDOW_ID="$(swift "$RUNNER_TEMP/quick-window-id.swift" 620)"
          screencapture -x -o -l "$WINDOW_ID" "$RUNNER_TEMP/VPNNavigator-import-report.png"
          test -s "$RUNNER_TEMP/VPNNavigator-import-report.png"
          killall VPNNavigatorApp 2>/dev/null || true
          # Actual Launch Services delivery on a cold UI launch. Empty files
          # must only be listed; confirmation never runs in this capture.
          touch "$RUNNER_TEMP/工作网络.ovpn" "$RUNNER_TEMP/家庭网络.ovpn" "$RUNNER_TEMP/说明.txt"
          cat > "$RUNNER_TEMP/check-document-app.swift" <<'SWIFT'
          import AppKit
          import CoreServices
          let app = URL(fileURLWithPath: CommandLine.arguments[1]).standardizedFileURL
          let file = URL(fileURLWithPath: CommandLine.arguments[2])
          guard LSRegisterURL(app as CFURL, true) == noErr,
                NSWorkspace.shared.urlsForApplications(toOpen: file).contains(where: { $0.standardizedFileURL == app }) else {
              fatalError("Application is not registered as an OpenVPN document reader")
          }
          print("PASS: Launch Services lists the installed bundle for .ovpn documents.")
          SWIFT
          swift "$RUNNER_TEMP/check-document-app.swift" "$APP" "$RUNNER_TEMP/工作网络.ovpn"
          open -n -a "$APP" "$RUNNER_TEMP/工作网络.ovpn" "$RUNNER_TEMP/家庭网络.ovpn" "$RUNNER_TEMP/说明.txt" --args --vpnnav-ui-tab=profiles --vpnnav-ui-glass-snapshot --vpnnav-ui-demo-snapshot
          sleep 7
          WINDOW_ID="$(swift "$RUNNER_TEMP/quick-window-id.swift" 620)"
          screencapture -x -o -l "$WINDOW_ID" "$RUNNER_TEMP/VPNNavigator-import-review.png"
          test -s "$RUNNER_TEMP/VPNNavigator-import-review.png"
          killall VPNNavigatorApp 2>/dev/null || true
          open -n "$APP" --args --vpnnav-ui-tab=settings --vpnnav-ui-glass-snapshot --vpnnav-ui-demo-snapshot --vpnnav-ui-profile-recovery-snapshot
          sleep 7
          WINDOW_ID="$(swift "$RUNNER_TEMP/quick-window-id.swift" 580)"
          screencapture -x -o -l "$WINDOW_ID" "$RUNNER_TEMP/VPNNavigator-profile-recovery.png"
          test -s "$RUNNER_TEMP/VPNNavigator-profile-recovery.png"
          killall VPNNavigatorApp 2>/dev/null || true
          for STATE in filter empty; do
            open -n "$APP" --args --vpnnav-ui-tab=profiles --vpnnav-ui-glass-snapshot --vpnnav-ui-demo-snapshot "--vpnnav-ui-library-$STATE-snapshot"
            sleep 7
            WINDOW_ID="$(swift "$RUNNER_TEMP/window-id.swift")"
            screencapture -x -o -l "$WINDOW_ID" "$RUNNER_TEMP/VPNNavigator-library-$STATE.png"
            test -s "$RUNNER_TEMP/VPNNavigator-library-$STATE.png"
            killall VPNNavigatorApp 2>/dev/null || true
          done
          for TOOL in custom-routes route-explanation troubleshooting smart-connection profile-backup profile-health profile-update connection-history public-egress keyboard-help; do
            open -n "$APP" --args --vpnnav-ui-tab=routing --vpnnav-ui-glass-snapshot --vpnnav-ui-demo-snapshot "--vpnnav-ui-$TOOL-snapshot"
            sleep 7
            WINDOW_ID="$(swift "$RUNNER_TEMP/window-id.swift")"
            screencapture -x -o -l "$WINDOW_ID" "$RUNNER_TEMP/VPNNavigator-tool-$TOOL.png"
            test -s "$RUNNER_TEMP/VPNNavigator-tool-$TOOL.png"
            killall VPNNavigatorApp 2>/dev/null || true
          done
          open -n "$APP" --args --vpnnav-ui-tab=profiles --vpnnav-ui-demo-snapshot --vpnnav-ui-high-contrast-snapshot
          sleep 7
          WINDOW_ID="$(swift "$RUNNER_TEMP/window-id.swift")"
          screencapture -x -o -l "$WINDOW_ID" "$RUNNER_TEMP/VPNNavigator-high-contrast.png"
          test -s "$RUNNER_TEMP/VPNNavigator-high-contrast.png"
          killall VPNNavigatorApp 2>/dev/null || true
          for PAGE in overview profiles routing diagnostics settings; do
            open -n "$APP" --args "--vpnnav-ui-tab=$PAGE" --vpnnav-ui-glass-snapshot --vpnnav-ui-demo-snapshot --vpnnav-language=en
            sleep 7
            WINDOW_ID="$(swift "$RUNNER_TEMP/window-id.swift")"
            screencapture -x -o -l "$WINDOW_ID" "$RUNNER_TEMP/VPNNavigator-English-$PAGE.png"
            test -s "$RUNNER_TEMP/VPNNavigator-English-$PAGE.png"
            killall VPNNavigatorApp 2>/dev/null || true
          done
          for TOOL in language-settings keyboard-help profile-health profile-backup public-egress; do
            open -n "$APP" --args --vpnnav-ui-tab=settings --vpnnav-ui-glass-snapshot --vpnnav-ui-demo-snapshot --vpnnav-language=en "--vpnnav-ui-$TOOL-snapshot"
            sleep 7
            WINDOW_ID="$(swift "$RUNNER_TEMP/window-id.swift")"
            screencapture -x -o -l "$WINDOW_ID" "$RUNNER_TEMP/VPNNavigator-English-$TOOL.png"
            test -s "$RUNNER_TEMP/VPNNavigator-English-$TOOL.png"
            killall VPNNavigatorApp 2>/dev/null || true
          done
          for SCENE in cool warm; do
            swift scripts/capture-glass-calibration.swift "$SCENE" "$RUNNER_TEMP"
            sleep 3
            open -n "$APP" --args "--vpnnav-ui-tab=overview" "--vpnnav-ui-glass-snapshot" "--vpnnav-ui-demo-snapshot"
            sleep 7
            WINDOW_ID="$(swift "$RUNNER_TEMP/window-id.swift" 2> "$RUNNER_TEMP/$SCENE-bounds.txt")"
            screencapture -x -o -l "$WINDOW_ID" "$RUNNER_TEMP/VPNNavigator-glass-$SCENE.png"
            screencapture -x "$RUNNER_TEMP/VPNNavigator-composited-$SCENE.png"
            test -s "$RUNNER_TEMP/VPNNavigator-glass-$SCENE.png"
            killall VPNNavigatorApp 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VPNNavigator-visual-smoke
          path: |
            ${{ runner.temp }}/VPNNavigator-English-*.png
            ${{ runner.temp }}/VPNNavigator-high-contrast.png
            ${{ runner.temp }}/VPNNavigator-overview.png
            ${{ runner.temp }}/VPNNavigator-profiles.png
            ${{ runner.temp }}/VPNNavigator-routing.png
            ${{ runner.temp }}/VPNNavigator-diagnostics.png
            ${{ runner.temp }}/VPNNavigator-settings.png
            ${{ runner.temp }}/VPNNavigator-quick-access.png
            ${{ runner.temp }}/VPNNavigator-import-report.png
            ${{ runner.temp }}/VPNNavigator-import-review.png
            ${{ runner.temp }}/VPNNavigator-profile-recovery.png
            ${{ runner.temp }}/VPNNavigator-library-*.png
            ${{ runner.temp }}/VPNNavigator-tool-*.png
            ${{ runner.temp }}/VPNNavigator-Desktop-Before.png
            ${{ runner.temp }}/VPNNavigator-capture-failure.png
            ${{ runner.temp }}/*-bounds.txt
            ${{ runner.temp }}/VPNNavigator-glass-*.png
            ${{ runner.temp }}/VPNNavigator-wallpaper-*.png
            ${{ runner.temp }}/VPNNavigator-display-*.png
            ${{ runner.temp }}/VPNNavigator-composited-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Package verified .app using macOS ditto
        run: |
          APP='dist/VPN Navigator.app'
          OUT="$RUNNER_TEMP/VPN-Navigator-$VPNNAV_VERSION-macOS-Universal-UI-Test.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          unzip -t "$OUT"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$(basename "$OUT")" | tee VPN-Navigator-$VPNNAV_VERSION-macOS-Universal-UI-Test.sha256)
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: VPNNavigator-${{ env.VPNNAV_VERSION }}-macOS-Universal-UI-Test
          path: |
            ${{ runner.temp }}/VPN-Navigator-${{ env.VPNNAV_VERSION }}-macOS-Universal-UI-Test.zip
            ${{ runner.temp }}/VPN-Navigator-${{ env.VPNNAV_VERSION }}-macOS-Universal-UI-Test.sha256
          if-no-files-found: error

